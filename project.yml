name: AYR
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  AYRCore:
    path: Core
targets:
  AYR:
    type: application
    platform: iOS
    sources:
      - path: iOS/App
      - path: iOS/Shared
    settings:
      base:
        # TestFlight 준비 시 소유한 Bundle ID와 App Group으로 함께 바꾼다.
        PRODUCT_BUNDLE_IDENTIFIER: dev.ayr.app
        CODE_SIGN_ENTITLEMENTS: iOS/metadata/App.entitlements
        INFOPLIST_FILE: iOS/metadata/App-Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: AYRCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - target: AYRWidgets
        embed: true
  AYRWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/Widgets
      - path: iOS/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ayr.app.widgets
        CODE_SIGN_ENTITLEMENTS: iOS/metadata/Widgets.entitlements
        INFOPLIST_FILE: iOS/metadata/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: AYRCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
schemes:
  AYR:
    build:
      targets:
        AYR: all
    run:
      config: Debug
    archive:
      config: Release
