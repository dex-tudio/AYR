name: TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'App Store Connect에 업로드 (해제하면 IPA 빌드만)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: testflight-ayr
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pipeline check dependency
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Check core, storage, recovery and presentation
        run: |
          swift test --package-path Core
          bash scripts/check-storage.sh
          bash scripts/check-recovery.sh
          bash scripts/check-ios.sh
          bash scripts/testflight-check.sh
  archive:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26 or newer
        run: |
          selected=$(python3 - <<'PY'
          import re
          from pathlib import Path
          candidates = [(tuple(map(int, match.group(1).split('.'))), path) for path in Path('/Applications').glob('Xcode_*.app')
                        if (match := re.fullmatch(r'Xcode_(\d+(?:\.\d+)*).app', path.name)) and int(match.group(1).split('.')[0]) >= 26]
          if candidates:
              print(max(candidates)[1])
          PY
          )
          test -n "$selected"
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode / {split($2, version, "."); print version[1]}')
          test "$major" -ge 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Archive, export and optionally upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APP_PROFILE_BASE64: ${{ secrets.APPLE_APP_PROFILE_BASE64 }}
          APPLE_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
        run: bash scripts/testflight-build.sh
      - name: Save signed IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: AYR-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ayr-export/*.ipa
            ${{ runner.temp }}/AYR.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 7
