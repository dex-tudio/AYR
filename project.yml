name: AYR
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
packages:
  AYRCore:
    path: Core
targets:
  AYR:
    type: application
    platform: iOS
    sources:
      - path: iOS/App
      - path: iOS/Shared
      - path: iOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codemaker-kim.ayr
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iOS/metadata/App.entitlements
        INFOPLIST_FILE: iOS/metadata/App-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_ENABLE_MODULES: YES
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    postBuildScripts:
      - name: Bundle React Native code and images
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -e
          export PROJECT_ROOT="$PROJECT_DIR"
          export NODE_BINARY="$(command -v node)"
          if [[ -f "$PROJECT_ROOT/.xcode.env" ]]; then source "$PROJECT_ROOT/.xcode.env"; fi
          if [[ -f "$PROJECT_ROOT/.xcode.env.local" ]]; then source "$PROJECT_ROOT/.xcode.env.local"; fi
          if [[ "$CONFIGURATION" = *Debug* ]]; then export SKIP_BUNDLING=1; fi
          export ENTRY_FILE="$PROJECT_ROOT/index.js"
          export CLI_PATH="$("$NODE_BINARY" --print "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })")"
          export BUNDLE_COMMAND=export:embed
          "$PROJECT_ROOT/node_modules/react-native/scripts/react-native-xcode.sh"
    dependencies:
      - package: AYRCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - target: AYRWidgets
        embed: true
  AYRWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/Widgets
      - path: iOS/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codemaker-kim.ayr.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: iOS/metadata/Widgets.entitlements
        INFOPLIST_FILE: iOS/metadata/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: AYRCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
schemes:
  AYR:
    build:
      targets:
        AYR: all
    run:
      config: Debug
    archive:
      config: Release
