name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Core
      - name: Check storage transactions
        run: bash scripts/check-storage.sh
      - name: Check corruption recovery
        run: bash scripts/check-recovery.sh
      - name: Check money input and Swift syntax
        run: bash scripts/check-ios.sh
      - name: Check TestFlight pipeline success and failure handling
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3
          bash scripts/testflight-check.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build:web && npm run build:ios-js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-failure
          path: test-results/
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 or newer
        run: bash scripts/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.16.2 --no-document
      - name: Prepare workspace
        run: bash scripts/prepare-ios.sh
      - name: Save first resolved Podfile.lock
        uses: actions/upload-artifact@v4
        with:
          name: ios-pod-lock
          path: Podfile.lock
          if-no-files-found: error
      - name: Build app and widgets without signing
        run: |
          for configuration in Debug Release; do
            xcodebuild -workspace AYR.xcworkspace -scheme AYR \
              -configuration "$configuration" -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          done
